<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./main.js"></script>
    <title>Helpdesk</title>
</head>
<body>
    <form class="helpdeskForm" style="border: 1px solid black" >
        <label for="helpdeskTitle">Name your ticket: </label>
        <input type="text" id="helpdeskTitle" class="helpdeskTitle" name="helpdeskTitle">
        <br>
        <label for="helpdeskPriority">Choose priority: </label>
        <select id="helpdeskPriority" name="helpdeskPriority" class="helpdeskPriority">
            <option value="low">LOW</option>
            <option value="medium">MEDIUM</option>
            <option value="high">HIGH</option>
        </select>
        <button type="submit">ADD</button>
        <br>
        <label for="helpdeskPriority">Filter by:</label>
        <select id="helpdeskPriority" class="helpdeskFilter">
            <option value="all">ALL</option>
            <option value="new">NEW</option>
            <option value="doing">DOING</option>
         <option value="done">DONE</option>
        </select>
    </form>
    <ul class="helpdeskList">
    </ul>
</body>
</html>
